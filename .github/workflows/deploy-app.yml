name: Deploy app

# Publishes the dApp to GitHub Pages from main. Configure these repository
# variables (Settings > Secrets and variables > Actions > Variables) with the
# values printed by scripts/deploy.sh mainnet:
#   VITE_NETWORK, VITE_RPC_URL, VITE_CORE_ID, VITE_MARKET_ID, VITE_ESCB_ASSET
# Optional: VITE_USDC_ASSET, VITE_BASE ("/" when using a custom domain).
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    if: vars.VITE_CORE_ID != ''
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    env:
      VITE_NETWORK: ${{ vars.VITE_NETWORK || 'mainnet' }}
      VITE_RPC_URL: ${{ vars.VITE_RPC_URL }}
      VITE_CORE_ID: ${{ vars.VITE_CORE_ID }}
      VITE_MARKET_ID: ${{ vars.VITE_MARKET_ID }}
      VITE_ESCB_ASSET: ${{ vars.VITE_ESCB_ASSET }}
      VITE_USDC_ASSET: ${{ vars.VITE_USDC_ASSET }}
      VITE_BASE: ${{ vars.VITE_BASE || format('/{0}/', github.event.repository.name) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      - run: npm run build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: app/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
